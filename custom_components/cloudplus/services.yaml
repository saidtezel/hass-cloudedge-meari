ptz:
  name: PTZ Control
  description: Control PTZ (Pan-Tilt-Zoom) movement on a CloudEdge / Meari camera.
  target:
    entity:
      integration: cloudplus
      domain: camera
  fields:
    action:
      name: Action
      description: The PTZ action to perform.
      required: true
      selector:
        select:
          options:
            - label: Move
              value: move
            - label: Stop
              value: stop
    argument:
      name: Argument
      description: Direction for the move action.
      selector:
        select:
          options:
            - label: Left
              value: left
            - label: Right
              value: right
            - label: Up
              value: up
            - label: Down
              value: down
    duration:
      name: Duration
      description: >-
        Move for this many seconds, then stop (a nudge). Leave empty for
        press-and-hold: send "stop" on release. A move nobody stops ends
        after 20 seconds.
      selector:
        number:
          min: 0.1
          max: 20
          step: 0.1
          unit_of_measurement: s

ptz_preset:
  name: PTZ Preset
  description: Go to, save or delete a saved PTZ position on a CloudEdge / Meari camera.
  target:
    entity:
      integration: cloudplus
      domain: camera
  fields:
    action:
      name: Action
      description: Go to the preset, save the current position as it, or delete it.
      required: true
      selector:
        select:
          options:
            - label: Go to
              value: goto
            - label: Save current position
              value: save
            - label: Delete
              value: delete
    preset:
      name: Preset
      description: Preset slot number.
      required: true
      selector:
        number:
          min: 1
          max: 32
          mode: box
    name:
      name: Name
      description: Label stored with the preset when saving (defaults to "Preset N").
      selector:
        text:

set_detection_area:
  name: Set Detection Area
  description: >-
    Write one of the camera's detection areas. Copy the area's current value
    from the camera's Detection Areas sensor attributes and edit it; the value
    is written in the same shape. Only areas the camera already reports can
    be written.
  target:
    entity:
      integration: cloudplus
      domain: camera
  fields:
    area:
      name: Area
      description: Which detection area to write.
      required: true
      selector:
        select:
          options:
            - label: Alarm area (rectangles)
              value: roi
            - label: Polygon area
              value: polygon_roi
            - label: AI detection polygon
              value: smart_polygon_roi
            - label: Front camera AI polygon
              value: smart_front_polygon_roi
    value:
      name: Value
      description: The new area, in the format the Detection Areas sensor shows.
      required: true
      selector:
        object:
